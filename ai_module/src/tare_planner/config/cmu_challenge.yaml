# The exploration config the CMU-VLN pipeline actually runs (smart_vlm.launch).
#
# Copied from indoor_small.yaml and ours to tune from here on: the three scenario
# yamls beside it are vendored upstream tuning for generic worlds, so diverging from
# them is the point rather than drift to be corrected. It is a full copy, not an
# overlay, so a change to indoor_small.yaml will NOT propagate here.
#
# The one deliberate difference today is kAutoStart (see below).
tare_planner_node:
  ros__parameters:
    sub_start_exploration_topic_ : /start_exploration
    sub_terrain_map_topic_ : /terrain_map
    sub_terrain_map_ext_topic_ : /terrain_map_ext
    # /state_estimation, not upstream's /state_estimation_at_scan: only the six
    # topics in docker/system/challenge_topics_bridge.yaml reach the AI module's ROS
    # domain, and the scan-synchronised variant is not one of them. Safe swap --
    # StateEstimationCallback only latches robot_position_/robot_yaw_ and does no
    # time association with the registered scan.
    sub_state_estimation_topic_ : /state_estimation
    sub_registered_scan_topic_ : /registered_scan
    sub_coverage_boundary_topic_ : /sensor_coverage_planner/coverage_boundary
    sub_viewpoint_boundary_topic_ : /navigation_boundary
    sub_nogo_boundary_topic_ : /sensor_coverage_planner/nogo_boundary
    sub_joystick_topic_ : /joy
    sub_reset_waypoint_topic_ : /reset_waypoint
    # Where target_explorer (smart_vlm) asks the robot to stand so an under-observed target
    # object gets seen from a direction it has not been seen from. Requests, not commands:
    # each is snapped to the nearest candidate viewpoint -- already collision-free, in line
    # of sight and graph-connected -- and dropped if none is within
    # kTargetViewPointSnapMaxDist. TARE remains the only writer of /way_point_with_heading.
    sub_target_viewpoints_topic_ : /exploration/target_viewpoints
    # Which requested positions were placed and which the local horizon refused. Only the
    # refusals are a statement about the world -- a target the robot has not walked to yet
    # is reported as neither, so it is never written off as impossible.
    pub_target_feedback_topic_ : /exploration/target_viewpoint_feedback
    # May targets preempt frontier exploration. target_explorer holds this false until EVERY
    # target label has at least one instance -- an undiscovered label can only be found by
    # ordinary exploration, and preempting early would guarantee it stays undiscovered.
    # While true, the global tour is offered only the subspaces holding a target, and the
    # lookahead is aimed at the nearest one. Silent or stale => stock TARE.
    sub_target_preempt_topic_ : /exploration/target_preempt
    pub_exploration_finish_topic_ : exploration_finish
    pub_runtime_breakdown_topic_ : runtime_breakdown
    pub_runtime_topic_ : /runtime
    # Pose2D on /way_point_with_heading -- the challenge's waypoint interface and the
    # only drive output bridged out of this domain. /way_point is the *system's*
    # PointStamped topic, published by waypoint_converter downstream of us.
    pub_waypoint_topic_ : /way_point_with_heading
    pub_momentum_activation_count_topic_ : momentum_activation_count

    # false: hold the robot until std_msgs/Bool(true) lands on
    # sub_start_exploration_topic_. The supervisor publishes it the instant SAM holds
    # the question's prompts, alongside /pipeline/armed -- so exploration and bag
    # replay are released by the same event, and no ground is covered against a
    # detector still loading weights. Bool(false) pauses waypoint publishing so the
    # instruction reasoner can take /way_point_with_heading after explore_done.
    # Enforced in execute(): nothing is published before the gate opens, not even
    # the initial waypoint.
    #
    # This is what makes this file different from indoor_small.yaml. Set it true and
    # the robot drives the moment it initialises, which is what `just tare` wants.
    kAutoStart : false
    kRushHome : true
    kUseTerrainHeight : false
    kCheckTerrainCollision : true
    kExtendWayPoint : true
    kUseLineOfSightLookAheadPoint : true
    kNoExplorationReturnHome : false
    kExtendWayPointDistanceBig : 4.0
    kExtendWayPointDistanceSmall : 1.5
    kKeyposeCloudDwzFilterLeafSize : 0.05
    kRushHomeDist : 3.0
    kAtHomeDistThreshold : 0.5
    kTerrainCollisionThreshold : 0.3
    kLookAheadDistance : 4.0
    kUseMomentum : true 
    # Semantic steering. false here is exactly stock TARE, which is also what happens on its
    # own if target_explorer is absent or silent for kTargetViewPointTimeout -- so this is a
    # kill switch for A/B runs, not the thing keeping the feature safe.
    kUseTargetViewPoints : true
    kTargetViewPointTimeout : 5.0
    # How far the nearest CANDIDATE viewpoint may be from a requested target before the target
    # is called unreachable. Left at the upstream 0.5 deliberately: a candidate is already
    # collision-free, in line of sight and graph-connected, so a distant nearest one means the
    # request itself was unreachable -- a viewing direction pointing into the wall behind the
    # object -- and honouring it would send the robot somewhere useless. Raising this does not
    # buy coverage: the "far" verdict that dominates the rejection counts comes from
    # InLocalPlanningHorizon above, not from here, and that one is a distance statement the
    # priority-cell path already handles. Rejection is not final either -- target_explorer
    # retries the sector from further out.
    kTargetViewPointSnapMaxDist : 0.5
    # Deliberately small. Must-visit viewpoints have their covered points marked covered
    # before EnqueueViewpointCandidates scores anything, so every one of them shaves a little
    # off the marginal gain of genuine coverage viewpoints. At 8 that is negligible; at a few
    # tens it would visibly suppress frontier exploration.
    kMaxTargetViewPointNum : 8
    # Waypoint stall watchdog. PublishWaypoint() only runs inside `if (keypose_cloud_update_)`
    # -- set on every 5th registered scan, and returned out of before reaching it when the
    # start gate is shut or no candidate viewpoints exist. waypoint_converter ships
    # yawConfig -1 ("reach waypoint and stop"), so a single skipped round leaves the robot
    # parked at a waypoint nothing will replace.
    #
    # No progress for kWaypointStallTimeout -> force a planning round and re-send the
    # waypoint. Still nothing by kWaypointStallEscalateTimeout -> the waypoint is not late,
    # it is unreachable: retire that viewpoint and remember the spot. Re-arms after each
    # escalation, so a second blocking viewpoint gets retired too.
    #
    # Both are sampled by execute()'s 1000 ms wall timer, so a threshold of T actually fires
    # somewhere in [T, T+1): the escalate value read 6.0 and the log said "stalled 7.0s".
    # The gap between the two is load-bearing and must stay at least one tick wide -- set
    # them equal and the blacklist lands on the same tick as the re-send, so the recovery
    # step never gets a chance to work and becomes dead code. The node clamps it if they
    # ever cross.
    # 3/12, and the two move independently on purpose. The FIRST value is the recovery: at
    # it, the node forces a planning round and re-sends the waypoint (PublishWaypoint
    # re-extends the carrot from the robot's current pose), every tick, for free. Delaying
    # that just leaves the robot standing still longer, so it stays at 3 s.
    # The SECOND is the give-up: retire the viewpoint and blacklist the spot for the rest of
    # the run. That one was too eager at 5 s -- negotiating a doorway legitimately takes
    # longer than 3 s to make kStallProgressDist, so healthy squeezing was being written off.
    # 39 stalls fired across a 15-scene sweep and 7 viewpoints were retired; one question
    # stalled 7 times inside a 1.5 m radius, walled the spot off, covered 12 m and then
    # declared the scene covered. 12 s buys nine seconds of continuous re-planning before
    # anything is abandoned, at no cost in responsiveness.
    kUseWaypointStallWatchdog : true
    kWaypointStallTimeout : 3.0
    kWaypointStallEscalateTimeout : 12.0
    # Above odometry jitter: too small and a parked robot looks like it is creeping, and the
    # watchdog never fires at all.
    kStallProgressDist : 0.3
    # A doorway is about this wide; at 0.5 m one stall in it blacklisted the whole opening.
    kStallBlacklistRadius : 0.3
    kMaxStallBlacklistNum : 32
    kDirectionChangeCounterThr : 6
    kDirectionNoChangeCounterThr : 5
    kResetWaypointJoystickAxesID : 2

    # PlanningEnv
    kUseFrontier : true
    kFrontierClusterTolerance : 1.0
    # 4, not 8: frontier points are clustered at kFrontierClusterTolerance and clusters
    # smaller than this are DISCARDED, so at 0.2 m occupancy resolution a doorway-sized gap
    # or a slot behind furniture never registers as unexplored space at all. Halving it is
    # what lets TARE see narrow openings; the cost is a few noise clusters from lidar speckle.
    kFrontierClusterMinSize : 4
    kUseCoverageBoundaryOnFrontier : true
    kUseCoverageBoundaryOnObjectSurface : false

    # Rolling occupancy grid
    rolling_occupancy_grid/resolution_x : 0.2
    rolling_occupancy_grid/resolution_y : 0.2
    rolling_occupancy_grid/resolution_z : 0.2

    kSurfaceCloudDwzLeafSize : 0.4
    kCollisionCloudDwzLeafSize : 0.05
    kKeyposeGraphCollisionCheckRadius : 0.15
    kKeyposeGraphCollisionCheckPointNumThr : 1
    kKeyposeCloudStackNum : 5
    kPointCloudRowNum : 50
    kPointCloudColNum : 50
    kPointCloudLevelNum : 30
    kMaxCellPointNum : 100000
    kPointCloudCellSize : 18.0
    kPointCloudCellHeight : 1.8
    kPointCloudManagerNeighborCellNum : 5
    kCoverCloudZSqueezeRatio : 2.0

    # KeyposeGraph
    keypose_graph/kAddNodeMinDist : 0.3
    keypose_graph/kAddNonKeyposeNodeMinDist : 0.3
    keypose_graph/kAddEdgeConnectDistThr : 0.5
    keypose_graph/kAddEdgeToLastKeyposeDistThr : 0.5
    keypose_graph/kAddEdgeVerticalThreshold : 0.5
    keypose_graph/kAddEdgeCollisionCheckResolution : 0.1
    keypose_graph/kAddEdgeCollisionCheckRadius : 0.2
    keypose_graph/kAddEdgeCollisionCheckPointNumThr : 1

    # ViewPointManager
    viewpoint_manager/number_x : 45
    viewpoint_manager/number_y : 45
    viewpoint_manager/number_z : 1
    viewpoint_manager/resolution_x : 0.2
    viewpoint_manager/resolution_y : 0.2
    viewpoint_manager/resolution_z : 0.0
    kConnectivityHeightDiffThr : 0.25
    kGreedyViewPointSampleRange : 3
    kLocalPathOptimizationItrMax : 10
    # 0.30, down from 0.35 (upstream 0.5). This inflates each viewpoint's claim over the
    # collision grid, so anything closer than it to an obstacle point is refused a viewpoint:
    # at 0.35 that also refused corridors under ~0.7 m, and 9% of all target viewpoint
    # requests came back "in-reach but unstandable" -- doorways and wall-adjacent objects TARE
    # could see but would not stand at.
    # NOT 0.25, which is the robot's half-width exactly (local_planner.launch: vehicleWidth
    # 0.5) and leaves nothing for localisation error or the 0.05 m collision-cloud voxel. At
    # that value TARE places viewpoints the base autonomy's local planner -- which has its own
    # clearance and is not ours to change -- may refuse to drive to, and every one of those now
    # costs kWaypointStallEscalateTimeout (12 s) before it is abandoned.
    kViewPointCollisionMargin : 0.30
    kViewPointCollisionMarginZPlus : 0.25
    kViewPointCollisionMarginZMinus : 0.25
    kCollisionGridZScale : 1.0
    kCollisionGridResolutionX : 0.02
    kCollisionGridResolutionY : 0.02
    kCollisionGridResolutionZ : 0.0
    kCollisionPointThr : 1
    kLineOfSightStopAtNearestObstacle : true 
    kViewPointHeightFromTerrain : 0.75
    kViewPointHeightFromTerrainChangeThreshold : 0.6
    kCheckDynamicObstacleCollision : false
    kCollisionFrameCountMax : 3

    kSensorRange : 3.0
    kNeighborRange : 1.5
    kCoverageOcclusionThr : 0.2
    kCoverageDilationRadius : 0.25

    # Grid World
    kGridWorldXNum : 121
    kGridWorldYNum : 121
    kGridWorldZNum : 121
    kGridWorldCellHeight : 3.0
    kGridWorldNearbyGridNum : 5
    # 6, not 8: a viewpoint's score must EXCEED these for its cell to count as still worth
    # visiting (grid_world.cpp:628,636); below both, the cell flips EXPLORING -> COVERED.
    # Lowering keeps partially-seen corners in play instead of writing them off after one
    # pass. kMinAddPointNumBig is left alone -- it drives COVERED -> EXPLORING, the opposite
    # direction, and loosening that would churn cells the robot has genuinely finished.
    kMinAddPointNumSmall : 6
    kMinAddPointNumBig : 16
    kMinAddFrontierPointNum : 6
    kCellExploringToCoveredThr : 1
    kCellCoveredToExploringThr: 10
    kCellExploringToAlmostCoveredThr: 10
    kCellAlmostCoveredToExploringThr: 20
    kCellUnknownToExploringThr: 1

    # Visualization
    kExploringSubspaceMarkerColorGradientAlpha : true
    kExploringSubspaceMarkerColorMaxAlpha : 0.8
    kExploringSubspaceMarkerColorR : 0.0
    kExploringSubspaceMarkerColorG : 1.0
    kExploringSubspaceMarkerColorB : 0.0
    kExploringSubspaceMarkerColorA : 1.0
    kLocalPlanningHorizonMarkerColorR : 0.0
    kLocalPlanningHorizonMarkerColorG : 1.0
    kLocalPlanningHorizonMarkerColorB : 0.0
    kLocalPlanningHorizonMarkerColorA : 1.0
    kLocalPlanningHorizonMarkerWidth : 0.15
    kLocalPlanningHorizonHeight : 3.0
