# captioner.vlm_backends VQA configuration. See captioner/vlm_backends/constants.py for
# how each key is read, defaulted and validated. API keys are NOT here — this file is
# committed to git and shipped in the submission image. `just up` bakes each
# provider's key from .env into image ENV (see PROVIDERS in constants.py).

# local | cloud — two independent switches. Set both. A missing/unknown value
# is read as cloud. local = in-image Qwen (launch starts vqa_server). cloud =
# the hosted model named by `provider` / `model` below.
vlm_backend: cloud                    # answering / counting
target_extract_backend: cloud         # noun extraction before SAM is armed

# gemini | anthropic | dashscope | openrouter | openai | <anything, via base_url/model
# below>. Only supplies defaults — base_url/model/model_lite each override individually.
# OpenRouter model ids are vendor-namespaced (google/...). Leave base_url blank to use
# the preset in constants.py; a leftover DashScope URL here would override it.
provider: openrouter
base_url: ""
model: "google/gemini-3.7-flash"


# provider: dashscope
# base_url: "https://ws-l7okjx3b70y42gso.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
# model: "qwen3.7-flash"
# # Cheaper model for the extraction call (lite=True); blank falls back to the provider's
# # own lite preset, then to `model` above.


# Cheaper model for the extraction call (lite=True); blank falls back to the provider's
# own lite preset, then to `model` above. OpenRouter has no lite preset, so this is
# the same Gemini Flash until a cheaper slug is set.
model_lite: ""

# WHICH IMAGES EACH REASONER SENDS THE MODEL. Three independent keys, one per scored
# category, each read by its own helper -- category-1 (numerical_utils.select_context_views),
# category-2 (cat2_utils.marked_views) and category-3 (instruction_reasoner) -- by both the
# live reasoners and their offline benches, and recorded verbatim in every report row so a
# run says what it saw. Each key is validated on its own: an unset or unrecognised value
# falls back to `silhouette` independently of what the other two are set to.
#
#   crop             <run>/                    the ROI crop, plain and unannotated
#   silhouette       <run>/silhouette/         the ROI crop with mask outlines and
#                                              "label [map id]" captions, drawn by
#                                              sam_node's finalize pass
#   full             <run>/full/               the whole 360 panorama, plain
#   full_silhouette  <run>/full/silhouette/    the whole panorama, outlines + ids
#
# The full* values need sam_mapper's save_full_views: true (sam3_mecanum_sim.yaml);
# with it off nothing is written under full/ and each reasoner falls back to the
# cropped equivalent rather than sending nothing.
#
# Categories 1 and 2 count and identify single objects, which is what the tighter crop is
# good for: category 1 ships on `full_silhouette`, category 2 on the plain `crop`. Category 3
# wants `full_silhouette`: a route is planned over a whole room, and an ROI crop shows one
# corner of it -- the first cat-3 sim run sent 709x640 and 353x551 cuts of a 1920x640 frame
# and still had to reason about where to drive.
view_source_numerical: full_silhouette
view_source_object_reference: full_silhouette
view_source_instruction_following: full_silhouette

# How long a silhouette run waits for sam_node to finish writing the
# finalized copy before falling back to the plain crop, and how often it polls while
# waiting. Both reasoners fire on the same /pipeline/explore_done that starts the
# finalize pass, so arriving a few hundred ms early is normal, not a fault.
silhouette_wait_s: 5.0
silhouette_poll_s: 0.25
