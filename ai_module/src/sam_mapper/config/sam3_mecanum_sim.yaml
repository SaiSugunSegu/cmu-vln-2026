# SAM 3 mapping config — Unity sim / recorded sim bags (mecanum platform).
# See docs/M2_perception.md 3.5.

platform: mecanum_sim              # -> CloudImageFusion.scan2pixels_mecanum_sim (camera z=0.1)
detection_linear_state_time_bias: 0.0
detection_angular_state_time_bias: 0.0

sam3:
  model_id: facebook/sam3
  device: cuda
  dtype: bfloat16
  attn_implementation: flash_attention_2   # falls back to sdpa, then eager
  max_vision_features_cache_size: 1

  # Must be square: a reshape downstream of the ViT hardcodes a square token grid.
  # Valid sizes divide by patch 14 and give a grid divisible by window 24:
  #   [1008,1008] 5184 tokens (default) | [672,672] 0.44x | [336,336] 0.11x
  image_size: [1008, 1008]

  # Streaming disables SAM 3's hotstart heuristics, so these run stricter than the
  # model defaults to hold down duplicate tracks.
  score_threshold_detection: 0.7
  new_det_thresh: 0.8
  det_nms_thresh: 0.1
  recondition_every_nth_frame: 16

# Hard-coded focus list; each entry is one SAM 3 text prompt (a short noun phrase).
# instance: false -> background class: gets a negative id and is re-created every frame
# rather than tracked as a persistent 3D instance.
# Optional `label:` merges several prompts into one class.
objects:
  - {prompt: "chair",      instance: true}
  - {prompt: "pillow",      instance: true}
  - {prompt: "sofa",       instance: true}
  # - {prompt: "table",      instance: true}
  # - {prompt: "screen",     instance: true}
  # - {prompt: "cabinet",    instance: true}
  # - {prompt: "whiteboard", instance: true}
  # - {prompt: "painting",   instance: true}
  # - {prompt: "door",       instance: true}
  # - {prompt: "wall",       instance: false}
  # - {prompt: "floor",      instance: false}
  # - {prompt: "ceiling",    instance: false}

runtime:
  # Read by both sam_node and map_node. MultiThreadedExecutor defaults to
  # cpu_count() threads, all spinning in rclpy's Python wait loop and holding the GIL — the
  # actual GIL-starvation fix is running SAM3 in its own process (docs/M2_perception.md
  # 3.6-split); this just keeps each node's own executor lean.
  executor_threads: 16
  publish_annotated: true
  log_every_n_frames: 5
  cloud_window_before: 0.5         # gather clouds in [stamp - before, stamp + after]
  cloud_window_after: 0.1
  verbose_objects: false           # print every 2D detection + 3D map object per frame
