# Unity scene manifest — the source of truth for lazy per-scene download.
#
# Each scene is ONE zip in the ORGANIZERS' Drive folder, and a zip contains the whole
# Unity build for that scene: environment/Model.x86_64 + UnityPlayer.so + Model_Data/,
# plus map.ply, traversable_area.ply and object_list.txt. The scene IS the simulator —
# system_simulation_noviz.sh runs mesh/unity/environment/Model.x86_64 — which is why
# there is no simulator to fall back on when a scene is missing.
#
# `ros2 run smart_vlm scene_fetch <scene>` reads this file; scripts/eval/run_sim_sweep.py
# calls it for any scene a sweep needs and does not find on disk.
#
# Organizers' Drive folder (the 15 training scenes + variants), from README.md:
#  https://drive.google.com/drive/folders/1nki_xoFKX1bYr8m7qiGRQelwnQ7EKVYc?usp=drive_link
#
# To regenerate these ids after the organizers re-upload — no browsing needed:
#  docker exec iros2026_odyssey python3 -c 'import gdown; \
#    [print(f.path, f.id) for f in gdown.download_folder( \
#      url="https://drive.google.com/drive/folders/1nki_xoFKX1bYr8m7qiGRQelwnQ7EKVYc", \
#      skip_download=True, quiet=True)]'
#
# sha256 is optional and omitted: these zips are the organizers', so hashing them means
# downloading them first. scene_fetch skips the integrity check when the field is absent
# (same as bag_fetch). To pin one, run `sha256sum` on the downloaded zip and add it here.
#
# NOTE 3 zips exist upstream that are not benchmark scenes in their own right
# (office_building_2_without_360_cam is a variant); they are listed so `scene_fetch` can
# reach them, but nothing selects them automatically.

