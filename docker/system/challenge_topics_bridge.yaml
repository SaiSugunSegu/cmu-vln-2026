# Domain bridge config: ONLY the challenge-allowed topics cross the firewall.
# sim (domain 42)  ->  AI module (domain 0): the 6 allowed inputs + the question
# AI module (0)    ->  sim (42):             the 3 answer/actuation outputs
name: challenge_topic_firewall
from_domain: 42
to_domain: 0
topics:
  /camera/image:
    type: sensor_msgs/msg/Image
  /registered_scan:
    type: sensor_msgs/msg/PointCloud2
  /sensor_scan:
    type: sensor_msgs/msg/PointCloud2
  /terrain_map:
    type: sensor_msgs/msg/PointCloud2
  /terrain_map_ext:
    type: sensor_msgs/msg/PointCloud2
  /state_estimation:
    type: nav_msgs/msg/Odometry
  /challenge_question:
    type: std_msgs/msg/String
  /way_point_with_heading:
    type: geometry_msgs/msg/Pose2D
    from_domain: 0
    to_domain: 42
  /selected_object_marker:
    type: visualization_msgs/msg/Marker
    from_domain: 0
    to_domain: 42
  /numerical_response:
    type: std_msgs/msg/Int32
    from_domain: 0
    to_domain: 42
