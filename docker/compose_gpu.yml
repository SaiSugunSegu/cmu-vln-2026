services:
  system:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: iros2026_system
    privileged: true
    network_mode: host
    # FastDDS moves payloads over shared memory between same-host peers; with a
    # private /dev/shm the ai_module discovers topics but receives no messages.
    ipc: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
      - ../scripts:/home/docker/scripts:ro
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Init container: prepares the bind mounts so the non-root ai_module user
  # (uid 1001) can write into them — a Dockerfile can't chmod a bind mount, and
  # Docker creates a missing mount source as root, which uid 1001 then cannot use.
  # Runs as root, which is the point: the host user can't chown those dirs either.
  # This is a ONE-SHOT — it runs, fixes perms, and exits: `Exited (0)` is success.
  init:
    image: busybox
    volumes:
      - ../data:/data
      - ${HOME}/.cache/huggingface:/hf
    # The uid test guards the recursive chown: once seeded the HF cache is tens of
    # GB, and chown -R on every `up` would cost minutes for nothing. $$ is compose
    # escaping for a literal $.
    # Folded scalar: every line must sit at the SAME indent, or YAML keeps the
    # newlines and the shell sees a line starting with `&&`.
    command: >-
      sh -c "mkdir -p /data/bags /data/scenes /data/crops /data/captions /data/runs &&
      chmod -R a+w /data &&
      mkdir -p /hf &&
      if [ \"$$(stat -c %u /hf)\" != 1001 ]; then chown -R 1001:1001 /hf; fi"
    restart: "no"

  ai_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile
    container_name: iros2026_ai_module
    network_mode: host
    ipc: host
    env_file:
      - path: ../.env
        required: false   # fine if it doesn't exist; HF_TOKEN just won't be set
    # backend/provider/model are configured in ai_module/src/captioner/config/vqa.yaml,
    # not here; .env only supplies each provider's API key (see PROVIDERS in
    # captioner/vlm_backends/constants.py) plus HF_TOKEN.
    environment:
      # No privileged: true — the nvidia runtime reservation below is what grants
      # GPU access, and privileged would hand the container every host device.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    volumes:
      # Host data/ maps 1:1 to /data — bags, benchmark, crops, captions, runs.
      # Put caption input under data/crops, read results from data/captions.
      # Scene recordings live in data/bags (gitignored by `data/bags/*`, with README.md
      # and scenes.yaml kept). Do NOT bind a separate <repo>/bags over /data/bags: it
      # shadows every recording, so bag_fetch reads each scene as missing and re-downloads
      # it from Drive, and the new source lands root-owned outside init's reach.
      - ../data:/data
      # Ground-truth QA files are tracked in git; nothing in the container writes them.
      - ../data/benchmark:/data/benchmark:ro
      # Repo scripts (eval drivers) at a fixed container path.
      - ../scripts:/home/docker/scripts:ro
      # VQA config, live: mounted over the INSTALLED share dir (not src/), because the
      # Dockerfile's colcon build is a plain build, not --symlink-install, so
      # install/captioner/share/captioner/config is a copy taken at image-build time, not
      # a link back to src/. This mount is what makes it live instead. Every reader
      # (captioner.vlm_backends.config.resolve_config_path via ament_index_python) reads
      # from here, so an edit to ai_module/src/captioner/config/vqa.yaml on the host takes
      # effect on the next `ros2 run`/`ros2 launch` inside the already-running container —
      # no rebuild needed. A node that is already running still needs restarting: it read
      # the file once, at import time.
      - ../ai_module/src/captioner/config:/home/docker/ai_module/install/captioner/share/captioner/config:ro
      # Persist HF model weights across container rebuilds.
      - ${HOME}/.cache/huggingface:/home/docker/.cache/huggingface
    depends_on:
      init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
