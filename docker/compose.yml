services:
  system:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: iros2026_system
    privileged: true
    network_mode: host
    # FastDDS moves payloads over shared memory between same-host peers; with a
    # private /dev/shm the ai_module discovers topics but receives no messages.
    ipc: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
      - ../scripts:/home/docker/scripts:ro
    stdin_open: true
    tty: true

  # Init container: prepares the bind-mounted bags dir so the non-root ai_module
  # user can write fetched bags into it (a Dockerfile can't chmod a bind mount).
  # This is a ONE-SHOT — it runs, fixes perms, and exits: `Exited (0)` is success.
  bags_init:
    image: busybox
    volumes:
      - ../bags:/data/bags
    command: sh -c "mkdir -p /data/bags && chmod -R a+w /data/bags"
    restart: "no"

  ai_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile
    container_name: iros2026_ai_module
    network_mode: host
    ipc: host
    env_file:
      - path: ../.env
        required: false   # fine if it doesn't exist; HF_TOKEN just won't be set
    environment:
      - HF_HOME=/home/docker/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/home/docker/.cache/huggingface/hub
      - TRANSFORMERS_CACHE=/home/docker/.cache/huggingface/hub
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - CAPTIONER_OFFLINE=1
    volumes:
      - ../bags:/data/bags
      - ../data:/data/workspace
      - ${HOME}/.cache/huggingface:/home/docker/.cache/huggingface
      - ${HOME}:${HOME}
    depends_on:
      bags_init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
