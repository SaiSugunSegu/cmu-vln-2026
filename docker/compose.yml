services:
  system:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: iros2026_system
    privileged: true
    network_mode: host
    # FastDDS moves payloads over shared memory between same-host peers; with a
    # private /dev/shm the ai_module discovers topics but receives no messages.
    ipc: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
    stdin_open: true
    tty: true

  ai_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile
    container_name: iros2026_ai_module
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
